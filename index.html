<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login · Ordens de Serviço Orflie</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="login-wrap">
  <div class="card">
    <h1>Ordens de Serviço · Orflie</h1>
    <form id="form-login">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />

      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password" />

      <button class="btn" type="submit" id="btn-entrar">Entrar</button>
      <p class="erro hidden" id="erro"></p>
    </form>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1rem;">
      Não tem uma conta? Peça ao administrador para cadastrar seu acesso.
    </p>
  </div>
</main>

<script type="module">
  import { login, redirectIfLoggedIn } from "./app/auth.js";

  redirectIfLoggedIn();

  const form = document.getElementById("form-login");
  const erro = document.getElementById("erro");
  const btn = document.getElementById("btn-entrar");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    erro.classList.add("hidden");
    btn.disabled = true;
    btn.textContent = "Entrando...";
    try {
      await login(document.getElementById("email").value.trim(), document.getElementById("senha").value);
      window.location.href = "minhas-os.html";
    } catch (err) {
      erro.textContent = "Email ou senha inválidos.";
      erro.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
