<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Administração · Ordens de Serviço Orflie</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main id="conteudo">
  <div class="card">
    <h1>Administração</h1>

    <h2>Departamentos</h2>
    <table class="admin-table" id="tabela-departamentos">
      <thead><tr><th>Nome</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <form id="form-departamento" class="inline-form">
      <div>
        <label for="novo-departamento">Novo departamento</label>
        <input type="text" id="novo-departamento" maxlength="60" required placeholder="Ex: TI" />
      </div>
      <button class="btn" type="submit">Adicionar</button>
    </form>
    <p class="erro hidden" id="erro-departamento"></p>
  </div>

  <div class="card">
    <h2>Usuários</h2>
    <table class="admin-table" id="tabela-usuarios">
      <thead><tr><th>Nome</th><th>Email</th><th>Admin</th><th>Prestador de</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Criar novo usuário</h2>
    <form id="form-usuario">
      <label for="u-nome">Nome</label>
      <input type="text" id="u-nome" required maxlength="100" />

      <label for="u-email">Email</label>
      <input type="email" id="u-email" required />

      <label for="u-senha">Senha inicial</label>
      <input type="text" id="u-senha" required minlength="6" placeholder="Repasse ao colaborador por fora" />

      <div class="checkbox-row">
        <input type="checkbox" id="u-admin" />
        <label for="u-admin" style="margin:0;">É administrador</label>
      </div>

      <label>Prestador dos departamentos</label>
      <div id="u-departamentos"></div>

      <button class="btn" type="submit" id="btn-criar-usuario">Criar usuário</button>
      <p class="erro hidden" id="erro-usuario"></p>
      <p class="hidden" id="sucesso-usuario" style="color: var(--accent); font-size:0.9rem; margin-top:0.75rem;"></p>
    </form>
  </div>
</main>

<script type="module" src="app/admin.js"></script>
</body>
</html>
